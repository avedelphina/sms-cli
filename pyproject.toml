[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-cli"
version = "0.2.0"
description = "A local ModemManager SMS and prepaid-data management toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Tom Frost"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Telephony",
]

dependencies = ["mcp>=1.0,<2.0"]

[project.optional-dependencies]
test = ["build"]

[project.scripts]
sms = "sms_cli.cli:main"
sms-credit = "sms_cli.credit_cli:main"
smscp = "sms_cli.mcp_server:main"

[tool.setuptools]
packages = ["sms_cli", "sms_cli.resources", "sms_cli.resources.carriers"]

[tool.setuptools.package-data]
"sms_cli.resources" = ["sms"]
"sms_cli.resources.carriers" = ["*.json"]
